<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Cairo">
  <title>Cairo</title>
  <defs>
    <linearGradient id="py-lit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD98A"/><stop offset="1" stop-color="#F39A3D"/>
    </linearGradient>
    <linearGradient id="py-shade" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0782E"/><stop offset="1" stop-color="#A8431B"/>
    </linearGradient>
    <linearGradient id="py-sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7FE3D6"/><stop offset="1" stop-color="#2BA3B8"/>
    </linearGradient>
    <mask id="py-cres"><rect width="100" height="100" fill="#fff"/><circle cx="88" cy="16" r="9.5" fill="#000"/></mask>
  </defs>
  <circle cx="80" cy="20" r="11" fill="url(#py-sun)" mask="url(#py-cres)"/>
